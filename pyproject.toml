[project]
name = "hass-xiaomi-weather"
version = "0.1.0"
description = "Xiaomi Weather integration for Home Assistant"
requires-python = ">=3.14.2,<3.15"
dependencies = ["aiohttp>=3.13.3"]

[dependency-groups]
dev = [
  "homeassistant-stubs==2026.9.1",
  "pytest-homeassistant-custom-component==0.13.364",
  "pytest-cov>=7",
  "ruff>=0.15",
  "ty>=0.0.1",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components.xiaomi_weather --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["custom_components", "tests"]
